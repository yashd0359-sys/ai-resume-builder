server:
  port: ${PORT:8080}

spring:
  application:
    name: resumeforge-engine
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/app_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      initialization-fail-timeout: -1   # start even if Postgres is down; saving is best-effort

resumeforge:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}

logging:
  level:
    com.resumeforge: INFO
